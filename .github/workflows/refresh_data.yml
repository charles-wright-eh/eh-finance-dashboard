name: Finance Dashboard — Refresh Data

on:
  schedule:
    # Runs at 02:00 UTC = 02:00 GMT (winter) / 03:00 BST (summer)
    - cron: "0 2 * * *"
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed to commit data files back to the repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests PyNaCl

      - name: Run data refresh
        env:
          XERO_CONFIG: ${{ secrets.XERO_CONFIG }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/fetch_data.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: refresh finance data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
